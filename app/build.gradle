plugins {
    alias(libs.plugins.android.application)
}

def localProps = new Properties()
def lf = rootProject.file("local.properties")
if (lf.exists()) {
    lf.withInputStream { localProps.load(it) }
}
String apiBaseUrl = localProps.getProperty("api.base.url", "http://10.0.2.2:3010")
if (!apiBaseUrl.endsWith("/")) {
    apiBaseUrl += "/"
}

android {
    namespace 'com.example.teambalancer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.teambalancer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // This forces Gradle to use a full JDK (required for jlink)
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.gridlayout
    implementation libs.recyclerview
    implementation libs.viewpager2
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.security.crypto
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
